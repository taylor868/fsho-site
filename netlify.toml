[build]
  # Pure standard-library Python: no pip step needed.
  command = "python3 build/gen.py --check && python3 build/gen.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# Preview guards (noindex, robots Disallow, X-Robots-Tag) are written by gen.py
# into dist/_headers while content/site.json "preview" is true.

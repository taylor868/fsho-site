[build]
  command = "pip install -r requirements.txt && python build/gen.py --check && python build/gen.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# Preview guards (noindex, robots Disallow, X-Robots-Tag) are written by gen.py
# into dist/_headers while content/site.json "preview" is true.
